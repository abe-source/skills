<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title">
  <title id="hero-title">skills — AI agent skills, packaged and published</title>
  <defs>
    <radialGradient id="glow" cx="82%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#0a0d0a"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- One SKILL.md fanning out to multiple compatible tools, open-standard motif -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="13">
    <rect x="960" y="140" width="150" height="48" rx="7" fill="#111614" stroke="#eab308" stroke-width="2"/>
    <text x="980" y="169" fill="#fde68a">SKILL.md</text>

    <g stroke="#a16207" stroke-width="1.4" stroke-dasharray="2 4" opacity="0.85">
      <line x1="960" y1="150" x2="880" y2="90"/>
      <line x1="960" y1="164" x2="870" y2="164"/>
      <line x1="960" y1="178" x2="880" y2="238"/>
      <line x1="1110" y1="150" x2="1125" y2="90"/>
      <line x1="1110" y1="178" x2="1125" y2="238"/>
    </g>
    <circle cx="880" cy="90" r="3" fill="#4ade80"/>
    <circle cx="870" cy="164" r="3" fill="#4ade80"/>
    <circle cx="880" cy="238" r="3" fill="#4ade80"/>
    <circle cx="1125" cy="90" r="3" fill="#4ade80"/>
    <circle cx="1125" cy="238" r="3" fill="#4ade80"/>

    <text x="795" y="85" fill="#9ca3a3">claude code</text>
    <text x="795" y="169" fill="#9ca3a3">codex cli</text>
    <text x="795" y="243" fill="#9ca3a3">gemini cli</text>
    <text x="1135" y="85" fill="#9ca3a3">cursor</text>
    <text x="1135" y="243" fill="#9ca3a3">copilot</text>
  </g>

  <!-- Text -->
  <text x="80" y="130" font-family="'SF Mono', 'Fira Code', ui-monospace, Menlo, monospace" font-size="46" font-weight="700" fill="#f1f5f4">
    <tspan fill="#facc15">skills</tspan>
  </text>
  <text x="80" y="170" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#9ca3a3">
    AI agent skills, packaged and published
  </text>

  <text x="80" y="215" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#4b5563">
    SKILL.md — one open standard, works everywhere
  </text>
</svg>
